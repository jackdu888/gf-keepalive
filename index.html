<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giffgaff 保号助手</title>
    <style>
        :root { --primary-color: #7c4dff; --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 25px; border-left: 4px solid var(--primary-color); }
        .btn { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 15px 40px; font-size: 18px; cursor: pointer; width: 100%; transition: transform 0.2s; box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3); }
        .btn:active { transform: scale(0.98); }
        .record { margin-top: 25px; text-align: left; font-size: 14px; color: #666; }
        .warning { margin-top: 20px; background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 10px; font-size: 13px; text-align: left; color: #c53030; }
        img.hidden-traffic { display: none; } /* 虽然隐藏，但加载仍消耗流量 */
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🇬🇧 Giffgaff 保号</div>
        <p style="color:#666; font-size:14px;">极简流量消耗工具</p>
        
        <div class="info-box">
            <strong>本次将消耗：</strong><br>
            <span style="font-size: 18px; color: #2d3748;">约 120 KB 数据流量</span><br>
            <small style="color: #718096;">预计费用：£0.02-0.03</small>
        </div>

        <button class="btn" onclick="startKeepAlive()">🚀 开始保号</button>

        <img id="trafficImage" class="hidden-traffic" src="https://picsum.photos/1200/1200?random=1">

        <div class="record">
            <strong>使用记录</strong>
            <div id="logList">
                <div style="margin-top:5px;">√ 正在就绪...</div>
            </div>
        </div>

        <div class="warning">
            <strong>⚠️ 使用前必读：</strong><br>
            1. 关闭 Wi-Fi，确保使用移动数据<br>
            2. 仅允许浏览器使用移动数据<br>
            3. 完成后立即关闭移动数据
        </div>
    </div>

    <script>
        function startKeepAlive() {
            const log = document.getElementById('logList');
            const now = new Date();
            const timeStr = (now.getMonth()+1) + '/' + now.getDate() + ' ' + now.getHours() + ':' + now.getMinutes();
            
            // 模拟加载逻辑
            log.innerHTML = `<div style="color:green">√ ${timeStr} - 120.03 KB</div>` + log.innerHTML;
            
            // 强制刷新图片以产生新流量
            document.getElementById('trafficImage').src = "https://picsum.photos/1200/1200?random=" + Math.random();
            
            alert('保号请求已发出，流量消耗中...');
        }
    </script>
</body>
</html>
