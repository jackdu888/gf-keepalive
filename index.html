<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giffgaff 保号助手</title>
    <style>
        :root { --primary-color: #7c4dff; --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .logo { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; border-left: 4px solid var(--primary-color); }
        .btn { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 16px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3); margin-bottom: 20px; }
        .record-section { text-align: left; border-top: 1px solid #eee; pt: 15px; margin-top: 10px; }
        .record-title { font-weight: bold; font-size: 14px; margin: 15px 0 10px 0; color: #444; }
        .log-item { font-size: 13px; color: #2d3748; padding: 5px 0; border-bottom: 1px dashed #edf2f7; display: flex; justify-content: space-between; }
        .log-status { color: #48bb78; font-weight: bold; }
        .warning { margin-top: 20px; background: #fff5f5; border: 1px solid #feb2b2; padding: 12px; border-radius: 10px; font-size: 12px; text-align: left; color: #c53030; line-height: 1.6; }
        #traffic-seeder { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🇬🇧 Giffgaff 保号助手</div>
        <div class="subtitle">自动触发扣费流量 (已精准调优)</div>
        
        <div class="info-box">
            <strong style="font-size: 14px;">本次消耗统计：</strong><br>
            <span style="font-size: 18px; color: #2d3748; font-weight: bold;">115.62 KB</span><br>
            <small style="color: #718096;">预计扣费：£0.02 - £0.03</small>
        </div>

        <button class="btn" onclick="manualTrigger()">🚀 触发保号任务</button>

        <div class="record-section">
            <div class="record-title">📜 最近使用记录</div>
            <div id="logList">
                </div>
        </div>

        <div class="warning">
            <strong>⚠️ 运行指引：</strong><br>
            • 必须关闭 Wi-Fi 使用数据网络<br>
            • 流量需 >100KB 以激活扣费机制<br>
            • 建议每 4-5 个月自动运行一次
        </div>
    </div>

    <div id="traffic-seeder">
        <script>document.write("X".repeat(115000));</script>
    </div>

    <script>
        // 页面加载时自动记录并显示
        window.onload = function() {
            addRecord();
            displayRecords();
        };

        function addRecord() {
            let records = JSON.parse(localStorage.getItem('giffgaff_logs') || '[]');
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            // 添加新记录到开头
            records.unshift({ time: timeStr, size: "115.62 KB" });
            
            // 只保留最近 5 条记录
            if (records.length > 5) records = records.slice(0, 5);
            
            localStorage.setItem('giffgaff_logs', JSON.stringify(records));
        }

        function displayRecords() {
            const records = JSON.parse(localStorage.getItem('giffgaff_logs') || '[]');
            const logList = document.getElementById('logList');
            
            if (records.length === 0) {
                logList.innerHTML = '<div style="color:#999; font-size:12px;">暂无运行记录</div>';
                return;
            }

            logList.innerHTML = records.map(item => `
                <div class="log-item">
                    <span>${item.time}</span>
                    <span class="log-status">√ ${item.size}</span>
                </div>
            `).join('');
        }

        function manualTrigger() {
            location.reload(); // 刷新页面即触发流量下载和记录
        }
    </script>
</body>
</html>
