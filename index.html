<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giffgaff 保号助手</title>
    <style>
        :root { --primary-color: #7c4dff; --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .card { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 20px; border-left: 4px solid var(--primary-color); }
        .btn { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 12px; font-size: 16px; width: 100%; margin-bottom: 20px; }
        .record-section { text-align: left; border-top: 1px solid #eee; padding-top: 10px; }
        .log-item { font-size: 13px; color: #444; padding: 5px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
        .warning { margin-top: 20px; background: #fff5f5; border: 1px solid #feb2b2; padding: 12px; border-radius: 10px; font-size: 12px; text-align: left; color: #c53030; }
        #traffic-seeder { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 22px; font-weight: bold;">🇬🇧 Giffgaff 保号</div>
        <p style="color:#666; font-size:13px;">极简流量消耗工具</p>
        
        <div class="info-box">
            <strong>本次将消耗：</strong><br>
            <span style="font-size: 18px; font-weight: bold;">约 120 KB 数据流量</span><br>
            <small style="color: #718096;">预计费用：£0.02-0.03</small>
        </div>

        <button class="btn">🚀 正在自动保号...</button>

        <div class="record-section">
            <div style="font-weight:bold; font-size:14px; margin-bottom:8px;">使用记录</div>
            <div id="logList"></div>
        </div>

        <div class="warning">
            <strong>⚠️ 使用前必读：</strong><br>
            1. 关闭 Wi-Fi，确保使用移动数据<br>
            2. 完成后立即关闭移动数据
        </div>
    </div>

    <div id="traffic-seeder">
        <script>document.write("X".repeat(115000));</script>
    </div>

    <script>
        window.onload = function() {
            let logs = JSON.parse(localStorage.getItem('gg_logs') || '[]');
            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            // 记录本次运行
            logs.unshift({ time: timeStr, size: "120.03 KB" });
            if (logs.length > 5) logs = logs.slice(0, 5);
            localStorage.setItem('gg_logs', JSON.stringify(logs));

            // 显示记录
            document.getElementById('logList').innerHTML = logs.map(log => `
                <div class="log-item">
                    <span>√ ${log.time}</span>
                    <span style="color:#48bb78; font-weight:bold;">${log.size}</span>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
