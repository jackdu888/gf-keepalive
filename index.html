<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giffgaff 保号助手</title>
    <style>
        :root { --primary-color: #7c4dff; --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        body { font-family: -apple-system, sans-serif; background: var(--bg-gradient); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .card { background: white; border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: left; margin-bottom: 25px; border-left: 4px solid var(--primary-color); }
        .btn { background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 15px 40px; font-size: 18px; cursor: pointer; width: 100%; box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3); }
        .warning { margin-top: 20px; background: #fff5f5; border: 1px solid #feb2b2; padding: 15px; border-radius: 10px; font-size: 13px; text-align: left; color: #c53030; }
        /* 核心逻辑：这个隐藏层包含了约 115KB 的冗余数据 */
        #traffic-seeder { display: none; visibility: hidden; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">🇬🇧 Giffgaff 保号</div>
        <p style="color:#666; font-size:14px;">自动流量消耗工具 (已调优)</p>
        
        <div class="info-box">
            <strong>本次将消耗：</strong><br>
            <span style="font-size: 18px; color: #2d3748;">约 115 KB 数据流量</span><br>
            <small style="color: #718096;">预计费用：£0.02-0.03</small>
        </div>

        <button class="btn">🚀 自动运行中</button>

        <div class="warning">
            <strong>⚠️ 扣费标准：</strong><br>
            单次消耗需 >100KB 才能触发扣费。<br>
            当前页面已内置 115KB 冗余数据。
        </div>
    </div>

    <div id="traffic-seeder">
        <script>
            document.write("X".repeat(115000));
        </script>
    </div>
</body>
</html>
